# Builds the Maata Android app on GitHub's computers (no Android Studio needed).
# Runs when files in android/ change, or by hand: Actions -> "Build Maata Android app" -> Run workflow.
name: Build Maata Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write   # lets the build put the new APK on maataapp.com/download by itself

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Use the signing key (from GitHub Secrets)
        env:
          KS: ${{ secrets.MAATA_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.MAATA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAATA_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::No MAATA_KEYSTORE_BASE64 secret yet - only the test APK (debug) will be made."
            exit 0
          fi
          # remove spaces / line breaks that can sneak in while copy-pasting
          printf '%s' "$KS" | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/maata.keystore" 2>/dev/null; then
            echo "::warning::MAATA_KEYSTORE_BASE64 is not complete (part of the long text is missing). Paste it again in Settings > Secrets. Making only the test APK this time."
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/maata.keystore" -storepass "$KS_PW" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::warning::The signing key could not be opened: check MAATA_KEYSTORE_PASSWORD and MAATA_KEY_ALIAS (alias must be: maata). Making only the test APK this time."
            exit 0
          fi
          echo "MAATA_KEYSTORE=$RUNNER_TEMP/maata.keystore" >> "$GITHUB_ENV"
          echo "Signing key OK: the app will be signed with the permanent Maata key."

      - name: Build the app
        working-directory: android
        env:
          MAATA_KEYSTORE_PASSWORD: ${{ secrets.MAATA_KEYSTORE_PASSWORD }}
          MAATA_KEY_ALIAS: ${{ secrets.MAATA_KEY_ALIAS }}
          MAATA_KEY_PASSWORD: ${{ secrets.MAATA_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease assembleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Maata-test-${{ github.run_number }}.apk"
          [ -f android/app/build/outputs/bundle/release/app-release.aab ] && cp android/app/build/outputs/bundle/release/app-release.aab "out/Maata-PlayStore-${{ github.run_number }}.aab" || true
          [ -f android/app/build/outputs/apk/release/app-release.apk ] && cp android/app/build/outputs/apk/release/app-release.apk "out/Maata-release-${{ github.run_number }}.apk" || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Maata-Android-${{ github.run_number }}
          path: out/
          retention-days: 30

      # Publish: the signed APK becomes maataapp.com/download, and app-version.json tells every
      # installed Maata app that an update is ready. (Only signed builds: a test build has a different
      # key each time and could not install over the old app.)
      - name: Put the new app on maataapp.com
        if: github.ref == 'refs/heads/main'
        run: |
          APK="out/Maata-release-${{ github.run_number }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::warning::No signed APK (add the 4 MAATA_KEY... secrets). Not publishing to the website."
            exit 0
          fi
          cp "$APK" maata.apk
          printf '{"version":%s,"name":"1.0.%s","date":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app-version.json
          git config user.name "Maata build"
          git config user.email "build@maataapp.com"
          git add maata.apk app-version.json
          git commit -m "Maata app v1.0.${{ github.run_number }} (automatic)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
